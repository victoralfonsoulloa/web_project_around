<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="A social media web app where you can connect with your loved ones and share your most stunning pictures with the world."
    />
    <meta
      name="keywords"
      content="HTML, CSS, Traveling, Social, Media, landscape"
    />
    <meta name="author" content="Victor Ulloa" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="pages/index.css" />
    <title>Around the US</title>
  </head>
  <body>
    <div class="content-wrapper">
      <main class="main">
        <header class="header">
          <img
            src="images/logo.png"
            alt="Around the U.S logo"
            class="header__logo"
          />
        </header>
        <section class="profile">
          <div class="profile__container">
            <img
              src="images/profile__avatar.jpg"
              alt="A profile picture"
              class="profile__avatar"
            />
            <div class="profile__bio">
              <div class="profile__bio_container">
                <h1 class="profile__bio_name">Victor Alfonso</h1>
                <button class="popup__button--open" id="popup__button--open">
                  <img
                    src="images/edit-button.png"
                    alt="Edit button"
                    class="popup__button_image"
                  />
                </button>

                <div class="popup" id="popup--edit">
                  <div class="popup__container">
                    <form class="form form--edit">
                      <fieldset class="form__fieldset">
                        <h2 class="form__title">Edit Profile</h2>
                        <label for="form__field">
                          <input
                            type="text"
                            placeholder="Name"
                            class="form__input"
                            id="name"
                            required
                            minlength="2"
                            maxlength="40"
                          />
                          <span class="form__input-error name-error"></span>
                        </label>
                        <label for="form__field">
                          <input
                            type="text"
                            placeholder="About me"
                            class="form__input form__input-aboutMe"
                            id="aboutMe"
                            required
                            minlength="2"
                            maxlength="65"
                          />
                          <span class="form__input-error aboutMe-error"></span>
                        </label>
                        <button
                          type="submit"
                          class="form__button--save form__submit"
                        >
                          Save
                        </button>
                      </fieldset>
                    </form>
                    <button
                      class="popup__button--close"
                      id="popup__button--close"
                    >
                      <img
                        src="images/close-button.png"
                        alt="button-close_icon"
                        class="popup__button--close-icon"
                      />
                    </button>
                  </div>
                </div>
              </div>
              <h2 class="profile__bio_description">Software Engineer</h2>
            </div>
          </div>
          <button class="profile__bio_add">
            <img
              src="images/add-button.png"
              alt="Add button"
              class="profile__bio_add_button"
            />
          </button>
          <div class="popup popup-add" id="popup-add">
            <div class="popup__container">
              <form class="form form--add">
                <fieldset class="form__fieldset">
                  <h2 class="form__title">New Place</h2>
                  <label class="form__field">
                    <input
                      type="text"
                      placeholder="Title"
                      class="form__input form__input-name"
                      id="title"
                      required
                      minlength="2"
                      maxlength="40"
                    />
                    <span class="form__input-error title-error"></span>
                  </label>
                  <label class="form__field">
                    <input
                      type="url"
                      placeholder="Image URL"
                      class="form__input"
                      id="imageUrl"
                      pattern="https://.*"
                      required
                      minlength="2"
                      maxlength="40"
                    />
                    <span class="form__input-error imageUrl-error"></span>
                  </label>
                  <button
                    type="submit"
                    class="form__button--save popup__button--create form__submit"
                    id="popup__button--create"
                  >
                    Create
                  </button>
                </fieldset>
              </form>
              <button
                type="button"
                class="popup__button--close"
                id="popup__button--close-add"
              >
                <img
                  src="images/close-button.png"
                  alt="button-close_icon"
                  class="popup__button--close-icon"
                />
              </button>
            </div>
          </div>
        </section>
        <section class="cards"></section>
        <div class="popup" id="popup_img">
          <div class="popup__container-image">
            <img
              src="images/profile__avatar.jpg"
              class="popup-picture"
              alt=""
            />
            <p class="popup-caption"></p>
            <button
              type="button"
              class="popup__button--close"
              id="popup__button--close-img"
            >
              <img
                src="images/close-button.png"
                alt="button-close_icon"
                class="popup__button--close-icon"
              />
            </button>
          </div>
        </div>
      </main>
      <footer class="footer">
        <p class="footer__copyright">© Victor Ulloa, Around The U.S. 2024</p>
      </footer>
    </div>
    <template id="card-template">
      <div class="card">
        <img src="" alt="" class="card__image" />
        <button class="card__delete-image">
          <img
            src="images/delete-button.png"
            alt="Delete button icon"
            class="card__delete-image-icon"
          />
        </button>
        <div class="card__caption">
          <p class="card__caption_title"></p>
          <button class="card__caption_like">
            <img
              src="images/like-button.png"
              alt="Like button"
              class="card__caption-like_icon"
            />
          </button>
        </div>
      </div>
    </template>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
